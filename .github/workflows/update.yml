name: Atualizar dados

on:
  schedule:
    - cron: "17 6 * * *"   # todos os dias às 06:17 UTC; sem dados novos não há commit
  workflow_dispatch:        # botão "Run workflow" para correr à mão

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recolher e validar
        run: node scripts/update.mjs
      - name: Publicar se houver alterações
        run: |
          git add index.html data.json cache/matches.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Dados atualizados $(date -u +%Y-%m-%d)"
            git push
          fi
